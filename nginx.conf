# ==========================================
# 1. Redirección obligatoria de HTTP a HTTPS
# ==========================================
server {
    listen 80;
    server_name localhost;

    # Redirige todo el tráfico entrante por HTTP hacia HTTPS permanentemente (301)
    return 301 https://$host$request_uri;
}

# ==========================================
# 2. Servidor principal seguro (HTTPS)
# ==========================================
server {
    listen 443 ssl;
    server_name localhost;

    # Certificados SSL/TLS (ajusta las rutas a tus archivos reales)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Parámetros y protocolos de seguridad SSL recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # Límite máximo para el tamaño de las peticiones
    client_max_body_size 10M;

    # ==========================================
    # 🛡️ CABECERAS DE SEGURIDAD HTTP (Variables globales)
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://api.yandrydev.cloud; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;" always;

    # ==========================================
    # ⚙️ CONFIGURACIÓN DE RUTAS Y RENDIMIENTO
    # ==========================================

    # Compresión gzip para mayor velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Soporte para Vue Router (HTML5 History Mode)
    location / {
        # Bloquear métodos HTTP no deseados de forma limpia
        limit_except GET POST HEAD {
            deny all;
        }

        try_files $uri $uri/ /index.html;
    }

    # Caché optimizada para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        
        # Mantenimiento explícito de las cabeceras de seguridad para archivos estáticos
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://api.yandrydev.cloud; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;" always;
        
        access_log off;
    }

    # Denegar totalmente el acceso a archivos ocultos (como .git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Manejo de páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
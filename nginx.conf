server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # Límite máximo para el tamaño de las peticiones
    client_max_body_size 10M;

    # ==========================================
    # 🛡️ CABECERAS DE SEGURIDAD HTTP
    # ==========================================
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 🌐 CSP (Content Security Policy)
    # Permite recursos propios, CDNs comunes, fuentes de Google y conexiones a tu API backend
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://api.yandrydev.cloud; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;" always;


    # ==========================================
    # ⚙️ CONFIGURACIÓN DE RUTAS Y RENDIMIENTO
    # ==========================================

    # Bloquear métodos HTTP innecesarios o peligrosos (solo permitimos GET, POST, HEAD)
    if ($request_method !~ ^(GET|POST|HEAD)$ ) {
        return 405;
    }

    # Compresión gzip para mayor velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Soporte para Vue Router (HTML5 History Mode) -> Evita errores 404 al recargar subrutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché optimizada para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Denegar totalmente el acceso a archivos ocultos (como .git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Manejo de páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}